{% extends 'layout.html' %} {% block content %}
<header class="main-header">
  <h1>Friends</h1>
  <a href="/collection" class="logout-btn">← Back to Collection</a>
</header>

<main class="page-container" style="max-width: 600px; margin: 0 auto">
  <div class="card" style="margin-bottom: 2rem">
    <h2>Add a Friend</h2>
    <form
      action="/friends"
      method="POST"
      style="display: flex; gap: 0.5rem; margin-top: 1rem"
    >
      <input
        type="text"
        name="username"
        placeholder="Friend's Username"
        class="input__field"
        style="height: 40px"
        required
      />
      <button type="submit" class="btn-primary" style="height: 40px">
        Add Friend
      </button>
    </form>
  </div>

  <h2>Your Friends</h2>
  <div
    style="
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    "
  >
    {% for friend in friends %}
    <div
      class="card"
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
      "
    >
      <span style="font-weight: 600">{{ friend.username }}</span>
      <a
        href="/friends/{{ friend.id }}"
        class="btn-primary"
        style="
          text-decoration: none;
          padding: 0.4rem 0.8rem;
          font-size: 0.85rem;
        "
        >View Collection →</a
      >
    </div>
    {% else %}
    <p style="color: #a3a3a3">You haven't added any friends yet.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
