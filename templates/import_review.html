{% extends 'layout.html' %} {% block content %}
<h1>Review Imported Movies ({{ current_index + 1 }} of {{ total }})</h1>

<form action="/import/save" method="POST" class="box">
  <input type="hidden" name="current_index" value="{{ current_index }}" />

  <div class="input__wrapper">
    <label>Movie Title:</label>
    <input
      type="text"
      name="title"
      value="{{ film.title }}"
      class="input__field"
      required
    />
  </div>
  <br />

  <div class="input__wrapper">
    <label>Format:</label>
    <select name="format" class="input__field" required>
      {% if media_type == 'Physical' %}
      <option value="4K UHD" {% if film.notes="" ="4k" %}selected{% endif %}>
        4K UHD
      </option>
      <option value="Blu-ray">Blu-ray</option>
      <option value="DVD">DVD</option>
      {% else %}
      <option value="Apple TV">Apple TV</option>
      <option value="Prime Video">Prime Video</option>
      <option value="YouTube">YouTube</option>
      {% endif %}
    </select>
  </div>
  <br />

  <div class="input__wrapper">
    <label>Collection Name (Optional):</label>
    <input
      type="text"
      name="collection_name"
      placeholder="e.g. X-Men: The Cerebro collection"
      class="input__field"
    />
  </div>
  <br />

  <div class="input__wrapper">
    <label>Notes (Optional):</label>
    <input
      type="text"
      name="notes"
      value="{{ film.notes }}"
      class="input__field"
    />
  </div>
  <br />

  <button type="submit">
    {% if current_index + 1 == total %} Save & Finish Import {% else %} Save &
    Next Movie → {% endif %}
  </button>
</form>
{% endblock %}
