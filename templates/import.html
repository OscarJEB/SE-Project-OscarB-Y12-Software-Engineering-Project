{% extends 'layout.html' %} {% block content %}
<header class="main-header">
  <div class="header-brand">
    <h1>Import Movies</h1>
  </div>
  <a href="/collection" class="logout-btn">← Back to Collection</a>
</header>

<main class="page-container">
  <div class="card" style="max-width: 450px; margin: 0 auto">
    <h2 style="margin-bottom: 1.25rem">Upload CSV File</h2>

    <form
      action="/import"
      method="POST"
      enctype="multipart/form-data"
      style="
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
      "
    >
      <div style="display: flex; flex-direction: column; gap: 0.35rem">
        <label style="color: #a3a3a3; font-size: 0.85rem; font-weight: 500"
          >Media Type</label
        >
        <select
          name="media_type"
          class="input__field"
          style="
            height: 40px;
            min-height: 40px;
            max-height: 40px;
            width: 100%;
            box-sizing: border-box;
          "
          required
        >
          <option value="Physical">Physical (4K, Blu-ray, DVD)</option>
          <option value="Digital">Digital (Apple TV, Prime, YouTube)</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.35rem">
        <label style="color: #a3a3a3; font-size: 0.85rem; font-weight: 500"
          >CSV File</label
        >
        <input
          type="file"
          name="file"
          accept=".csv"
          class="input__field"
          style="
            height: 40px;
            min-height: 40px;
            max-height: 40px;
            width: 100%;
            box-sizing: border-box;
            padding: 0.4rem;
          "
          required
        />
      </div>

      <button
        type="submit"
        class="btn-primary"
        style="margin-top: 0.5rem; height: 40px; align-self: flex-start"
      >
        Upload & Review →
      </button>
    </form>
  </div>
</main>
{% endblock %}
