<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Uses Flask's url_for so paths never break on sub-routes -->
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <title>Media Tracker</title>
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/favicon.png') }}"
    />
    <meta name="theme-color" content="#14E6DD" />
  </head>
  <body>
    <main>
      <nav class="main-header">
        <!-- Logo aligned with your CSS -->
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          class="header-logo"
          alt="Media Tracker Logo"
        />
      </nav>

      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/serviceWorker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
