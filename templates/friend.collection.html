{% extends 'layout.html' %} {% block content %}
<header class="main-header">
  <h1>{{ friend.username }}'s Collection</h1>
  <a href="/friends" class="logout-btn">← Back to Friends</a>
</header>

<main class="page-container">
  <div
    style="
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    "
  >
    {% for film in films %}
    <div
      class="card"
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <div>
        <strong style="font-size: 1.1rem">{{ film.title }}</strong>
        <span
          style="
            background: #262626;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
          "
          >{{ film.format }}</span
        >
        {% if film.is_lent %}
        <span
          style="
            background: #dc2626;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
          "
          >Currently Lent Out</span
        >
        {% endif %}
      </div>
    </div>
    {% else %}
    <p style="color: #a3a3a3">This user has no films in their collection.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
